server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx serves byte ranges for mp4 by default, which the scroll-scrubbed
    # montage video needs (the browser seeks constantly while scrolling).
    types {
        text/html html;
        video/mp4 mp4;
        image/jpeg jpg jpeg;
        image/webp webp;
        video/webm webm;
    }

    gzip on;
    gzip_types text/html text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The page itself: always revalidate, so a redeploy shows up on the next visit.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Media: long cache. Assets are replaced under a NEW file name (or with a
    # ?v= query bump in index.html) whenever their content changes.
    location ~* \.(mp4|webm|jpg|jpeg|webp|png|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Nothing else is served; no directory listing, no dotfiles.
    location ~ /\. { deny all; }
    autoindex off;
}
